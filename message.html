<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Send Anonymous Message</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff7a00, #ffb347);
        }

        .box {
            width: 85%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #ff7a00;
        }

        p {
            color: #555;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 12px;
            resize: none;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #ff7a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.97);
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <div style="font-size:45px;">💌</div>

        <h1>Send Anonymous Message</h1>

        <p>Send a message without revealing your name.</p>

        <textarea
            id="message"
            placeholder="Write your message here..."
        ></textarea>

        <button onclick="sendMessage()">
            Send Anonymously 💌
        </button>

        <p id="status"></p>

    </div>

    <script>
        function sendMessage() {

            let message = document.getElementById("message").value;
            let status = document.getElementById("status");

            if (message.trim() === "") {
                status.innerText = "Please write a message first.";
                return;
            }

            status.innerText = "Message sent anonymously! 💌";

            document.getElementById("message").value = "";
        }
    </script>

</body>
</html>

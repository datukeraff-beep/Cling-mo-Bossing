<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: #00ff41;
        font-family: monospace;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #screen {
        width: 90%;
        max-width: 500px;
        text-align: center;
    }

    #text {
        font-size: 16px;
        min-height: 30px;
        text-shadow: 0 0 10px #00ff41;
    }

    .bar {
        width: 100%;
        height: 15px;
        border: 1px solid #00ff41;
        margin-top: 20px;
    }

    #progress {
        width: 0%;
        height: 100%;
        background: #00ff41;
        box-shadow: 0 0 15px #00ff41;
    }

    #prank {
        display: none;
    }

    #prank h1 {
        font-size: 30px;
        text-shadow: 0 0 20px #00ff41;
    }
</style>
</head>

<body>

<div id="screen">

    <div id="loading">
        <div id="text">INITIALIZING...</div>

        <div class="bar">
            <div id="progress"></div>
        </div>
    </div>

    <div id="prank">
        <h1>😂 BOBO MAG ML!</h1>
        <p>Telen kan bag Ml baboy.</p>
    </div>

</div>

<script>

let progress = 0;

const messages = [
    "INITIALIZING...",
    "LOADING SYSTEM...",
    "CHECKING CONNECTION...",
    "PROCESSING...",
    "ALMOST DONE..."
];

let i = 0;

const timer = setInterval(() => {

    document.getElementById("text").textContent = messages[i];

    progress += 20;

    document.getElementById("progress").style.width =
        progress + "%";

    i++;

    if (i >= messages.length) {

        clearInterval(timer);

        setTimeout(() => {

            document.getElementById("loading").style.display = "none";
            document.getElementById("prank").style.display = "block";

        }, 1000);
    }

}, 1000);

</script>

</body>
</html>

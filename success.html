<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Success - Orange Shop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-box {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            color: #ff6600;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;
            background: #ff6600;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-button:hover {
            background: #e65c00;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="success-icon">🎉</div>

        <h1>Order Successful!</h1>

        <p>
            Thank you for shopping at Orange Shop! 🧡
            <br>
            Your demo order has been placed successfully.
        </p>

        <a href="index.html" class="home-button">
            Back to Orange Shop
        </a>

    </div>

</body>
</html>

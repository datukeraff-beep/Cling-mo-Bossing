<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Anonymous Inbox</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff7a00, #ffb347);
            padding: 30px 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: white;
            text-align: center;
        }

        .subtitle {
            color: white;
            text-align: center;
        }

        .message {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .anonymous {
            color: #ff7a00;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: #666;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📥 My Anonymous Inbox</h1>

        <p class="subtitle">
            Messages sent to you anonymously
        </p>

        <div class="message">
            <div class="anonymous">💌 Anonymous</div>

            <p>
                Welcome to your AnonBox! This is a test message. 🤩
            </p>
        </div>

        <div class="empty">
            More anonymous messages will appear here.
        </div>

    </div>

</body>
</html>
